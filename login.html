<!DOCTYPE html>

<html> <head> <meta charset="UTF-8"> <title>Login | ELFAMCO</title> 
<link rel="stylesheet" href="style.css"> </head> 
<body class="login-page">
<div class="login-container"> <div class="login-header"> 
<img src="images/logo.png" alt="ELFAMCO Logo" class="login-logo"> 
<h1>ELFAMCO</h1> 
<p>Elvita Farmers Multi Purpose Cooperative</p> 
</div> 
<form id="loginForm"> 
    <h2>Welcome Back</h2> 
    <p class="login-description">Log in to your account to continue.</p> 
    <div class="form-group"> 
    <label for="loginEmail">Email Address</label> 
    <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required> 
</div> 
<div class="form-group"> 
<label for="loginPassword">Password</label> 
<input type="password" id="loginPassword" name="password" placeholder="Enter your password" required> 
</div> 
<button type="submit" class="login-button">Log In</button> 
<p id="loginMessage" class="login-message"></p> 
<p class="register-prompt"> Don't have an account? 
<a href="registration.html">Register here</a> 
</p> 
</form> 
</div> 
<script src="script.js"></script>
</body> </html>
